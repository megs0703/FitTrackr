services:
  - type: web
    name: fittrackr-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: fittrackr-db
          property: host
      - key: DB_USER
        fromDatabase:
          name: fittrackr-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fittrackr-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: fittrackr-db
          property: database
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: fittrackr-db
    databaseName: fittrackr
    user: fittrackr
